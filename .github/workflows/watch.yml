name: Philharmonie ticket watch

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may run it a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      # remembers what was already alerted, so you don't get the same ping every 10 min
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-

      - name: Check tickets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python phil_watch.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: watch-state-${{ github.run_id }}
